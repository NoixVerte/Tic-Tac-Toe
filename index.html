<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="game-wrapper">
        <div class="turn-label">It is X's turn!</div>
        <div class="gameboard">
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
        </div>
        <div id="scoreboard">
            <div>X's score: 0</div>
            <div>O's score: 0</div>
        </div>
        <div class="button-wrapper">
            <button id="new-game-btn">New game</button>
            <button id="change-names-btn">Change names</button>
        </div>
    </div>
    <div id="change-names-popup-bckrgnd"></div>
    <div id="change-names-popup">
        <div class="change-name-form-wrapper">
            <span>Player X new name:</span>
            <input type="text">
        </div>
        <div class="change-name-form-wrapper">
            <span>Player O new name:</span>
            <input type="text">
        </div>
        <div class="popup-button-wrapper">
            <button  id="confirm-names-popup-btn">Confirm</button>
            <button id="cancel-names-popup-btn">Cancel</button>
        </div>
    </div>
</body>
</html>
